server:
  port: 8080
spring:
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    url: jdbc:mysql://192.168.20.100:3306/lease?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=GMT%2b8
    username: root
    password: Nly.123456
    hikari:
      connection-test-query: SELECT 1 # 自动检测连接
      connection-timeout: 60000 #数据库连接超时时间,默认30秒
      idle-timeout: 500000 #空闲连接存活最大时间，默认600000（10分钟）
      max-lifetime: 540000 #此属性控制池中连接的最长生命周期，值0表示无限生命周期，默认1800000即30分钟
      maximum-pool-size: 12 #连接池最大连接数，默认是10
      minimum-idle: 10 #最小空闲连接数量
      pool-name: SPHHikariPool # 连接池名称
#      设置时区
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
  data:
    redis:
      host: 192.168.20.100
      port: 6379
      database: 0

  #用于打印框架生成的sql语句，便于调试
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
#      查询时不返回isDeleted结果，自动为查询结果增加is_deleted=0，并将删除转为更新语句，已删除默认为1，未删除为0
#      只对mybatis plus自动生成的sql语句生效
      logic-delete-field: isDeleted

minio:
  endpoint: http://192.168.20.100:9000
  access-key: minioadmin
  secret-key: minioadmin
  bucket-name: lease
#展开queryVo中的三个参数，可在接口网页单独传参
springdoc:
  default-flat-param-object: true



